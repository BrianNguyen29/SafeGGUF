# Release template: render with scripts/render_k8s_manifest.py.
# The signed container workflow emits a rendered, digest-pinned artifact.
# Do not apply this template directly.
apiVersion: v1
kind: Pod
metadata:
  name: llm-inference-pod-with-safegguf
  namespace: ai-serving
  labels:
    app: llama-cpp-serving
    security.policy: safegguf-validated
  annotations:
    safegguf.release-version: "SAFEGGUF_RELEASE_VERSION"
spec:
  securityContext:
    runAsNonRoot: true
    runAsGroup: 65532
    fsGroup: 65532
  volumes:
    - name: unvalidated-source-volume
      persistentVolumeClaim:
        claimName: unvalidated-models-pvc
    - name: private-staging-volume
      emptyDir:
        sizeLimit: 16Gi
    - name: attestation-volume
      emptyDir:
        medium: Memory
        sizeLimit: 10Mi
  initContainers:
    # Preparation only. Admission is performed entirely by the next container.
    - name: safegguf-prepare-directories
      image: busybox:1.36-musl
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          mkdir -p /private-stage/validated /attestation
      resources:
        limits:
          cpu: "100m"
          memory: "32Mi"
      volumeMounts:
        - name: private-staging-volume
          mountPath: /private-stage
        - name: attestation-volume
          mountPath: /attestation
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
    # One process copies, hashes, validates, and publishes the same staged inode.
    # Kubernetes init ordering prevents serving after a non-zero admission exit.
    - name: safegguf-pre-admission-validator
      image: "SAFEGGUF_RELEASE_IMAGE"
      imagePullPolicy: IfNotPresent
      command: ["/usr/local/bin/safegguf"]
      args:
        - admit
        - /models/model.gguf
        - --cas-dir
        - /private-stage/validated
        - --attestations-dir
        - /attestation
        - --profile
        - llama-cpp
        - --endian
        - auto
        - --max-file-size-bytes
        - "17179869184"
      resources:
        limits:
          cpu: "1000m"
          memory: "256Mi"
        requests:
          cpu: "100m"
          memory: "64Mi"
      volumeMounts:
        - name: unvalidated-source-volume
          mountPath: /models
          readOnly: true
        - name: private-staging-volume
          mountPath: /private-stage
        - name: attestation-volume
          mountPath: /attestation
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
  containers:
    - name: llama-cpp-server
      image: ghcr.io/ggml-org/llama.cpp:server@sha256:970168341efef973da5666ea5c362fa428ee66ba0dfa621b0f69bf3feb3320f7
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          # Exactly one complete checksum pin must be present.
          set -- /attestation/*.sha256
          [ "$#" -eq 1 ] && [ -f "$1" ]
          PIN="$1"
          DIGEST="${PIN##*/}"
          DIGEST="${DIGEST%.sha256}"
          [ "${#DIGEST}" -eq 64 ]
          case "$DIGEST" in *[!0-9a-f]*) exit 2 ;; esac
          (cd /validated && sha256sum -c "$PIN")
          # The pinned runtime resolves bundled libraries relative to /app.
          cd /app
          exec /app/llama-server -m "/validated/$DIGEST" -c 4096 --host 0.0.0.0 --port 8080
      ports:
        - containerPort: 8080
          name: http
      volumeMounts:
        - name: private-staging-volume
          mountPath: /validated
          subPath: validated
          readOnly: true
        - name: attestation-volume
          mountPath: /attestation
          readOnly: true
      resources:
        limits:
          cpu: "8000m"
          memory: "16Gi"
        requests:
          cpu: "2000m"
          memory: "8Gi"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
# This is a Pod integration example. A production serving controller must set
# its own rollout, readiness, storage and admission timeout policy. Do not use
# activeDeadlineSeconds as an admission-only timer: it also stops serving.
