name: Container Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or version override to build (e.g. v0.3.6)'
        required: false
        default: 'v0.3.7-dev'

permissions:
  contents: read
  packages: write
  id-token: write # Required for Cosign keyless OIDC signing

jobs:
  build-and-sign:
    name: Build, SBOM, Provenance & Cosign Sign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=${{ github.event.inputs.tag || 'latest' }}

      - name: Build and push container image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Sign container image with Cosign (Keyless OIDC)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          IMAGE_URI: ghcr.io/${{ github.repository }}
        run: |
          echo "Signing container image at digest: ${IMAGE_URI}@${DIGEST}"
          cosign sign --yes "${IMAGE_URI}@${DIGEST}"

      - name: Verify Cosign Signature
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          IMAGE_URI: ghcr.io/${{ github.repository }}
        run: |
          echo "Verifying cosign signature..."
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE_URI}@${DIGEST}"
          echo "[SUCCESS] Image signature and SLSA provenance cryptographically verified."
