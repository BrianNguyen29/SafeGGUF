name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Exhaustive Unit & Regression Tests
        run: zig build test --summary all

      - name: Build Binary (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Generate Fixtures
        run: python tests/generate_fixtures.py

      - name: Run End-to-End CLI Integration Tests (Exact Exit Codes & Invariants)
        run: python tests/cli_test.py

