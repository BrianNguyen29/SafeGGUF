name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Zig
        uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7 # v1.2.2
        with:
          version: 0.13.0

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Verify Code Formatting
        run: zig fmt --check src/ build.zig tests/*.zig

      - name: Generate Fixtures and Seed Corpus
        run: python tests/generate_fixtures.py

      - name: Run Exhaustive Unit, Fuzz, & Regression Tests
        run: zig build test --summary all

      - name: Build Binary (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Run End-to-End CLI Integration Tests (Exact Exit Codes & Invariants)
        run: python tests/cli_test.py

      - name: Build Upstream ggml 0.23.0 Oracle
        run: bash tests/build_oracle.sh

      - name: Run Independent Type Oracle Verification
        run: python tests/test_oracle_types.py

      - name: Run True Differential Test Suite (SafeGGUF vs Upstream ggml 0.23.0)
        run: python tests/differential.py


