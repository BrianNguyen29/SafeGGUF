name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  core:
    name: Core tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify Code Formatting
        run: zig fmt --check src/ build.zig tests/*.zig

      - name: Generate Fixtures and Seed Corpus
        run: python tests/generate_fixtures.py

      - name: Run Exhaustive Unit, Fuzz, & Regression Tests
        run: zig build test --summary all

      - name: Build Binary (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Run End-to-End CLI Integration Tests (Exact Exit Codes & Invariants)
        run: python tests/cli_test.py

      - name: Run Negative Corpus & Advisory Provenance Checks (Exit 2 Reject Contract)
        run: python tests/negative_corpus.py

  oracle:
    name: "Oracle & differential on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Generate Fixtures and Seed Corpus
        run: python tests/generate_fixtures.py

      - name: Build Binary (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Build Upstream ggml 0.23.0 Oracle
        run: bash tests/build_oracle.sh

      - name: Run Independent Arithmetic Oracle Verification (Python Bigint)
        run: python tests/arithmetic_oracle.py

      - name: Run Independent Type Oracle Verification
        run: python tests/test_oracle_types.py

      - name: Generate Differential Matrix Fixtures
        run: python tests/differential_matrix.py

      - name: Run True Differential Test Suite (SafeGGUF vs Upstream ggml 0.23.0)
        run: python tests/differential.py

  fuzz:
    name: Fuzz on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Generate Fixtures and Seed Corpus
        run: python tests/generate_fixtures.py

      - name: Build Binary (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Verify Fuzz Crash Handler Persistence
        run: python tests/fuzz_mutation.py --test-crash-handler

      - name: Run High-Throughput Mutation Fuzzing (2,000 Iterations, 4,000 Executions)
        run: python tests/fuzz_mutation.py --iterations 2000

      - name: Upload Fuzz Crash Artifacts on Failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.os }}
          path: tests/fuzz-artifacts/
          if-no-files-found: ignore

  bench:
    name: Bench on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0

      - name: Run Resource-Budget Benchmark Suite (Scales + Instrumented Backend-Read Gate)
        run: zig build bench --summary all

  release:
    name: Build & Publish Release Artifacts
    needs: [core, oracle, fuzz, bench]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Build Cross-Platform Release Binaries & SHA256 Manifest
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          targets=("x86_64-linux" "aarch64-linux" "x86_64-macos" "aarch64-macos" "x86_64-windows")
          for target in "${targets[@]}"; do
            echo "Building for $target..."
            ext=""
            if [[ "$target" == *"windows"* ]]; then
              ext=".exe"
            fi
            zig build -Doptimize=ReleaseSafe -Dtarget=$target -Dversion="$version"
            cp zig-out/bin/safegguf${ext} dist/safegguf-${target}${ext}
          done
          cd dist
          sha256sum safegguf-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate SPDX 2.3 SBOM (dist/safegguf.spdx.json)
        run: |
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:] if tag.startswith("v") else tag
          commit = os.environ["GITHUB_SHA"]
          run_id = os.environ["GITHUB_RUN_ID"]
          zig_version = subprocess.run(
              ["zig", "version"], capture_output=True, text=True, check=True
          ).stdout.strip()

          def checksum(algorithm, path):
              digest = hashlib.new(algorithm)
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def spdx_id(name):
              return "SPDXRef-File-" + name.replace(".", "-").replace("_", "-")

          files = []
          relationships = []
          for name in sorted(os.listdir("dist")):
              if name == "safegguf.spdx.json":
                  continue
              path = os.path.join("dist", name)
              files.append({
                  "fileName": name,
                  "SPDXID": spdx_id(name),
                  "checksums": [
                      {"algorithm": "SHA1", "checksumValue": checksum("sha1", path)},
                      {"algorithm": "SHA256", "checksumValue": checksum("sha256", path)},
                  ],
                  "licenseConcluded": "NOASSERTION",
                  "copyrightText": "NOASSERTION",
                  "downloadLocation": "NOASSERTION",
              })
              relationships.append({
                  "spdxElementId": "SPDXRef-Package-safegguf",
                  "relatedSpdxElement": spdx_id(name),
                  "relationshipType": "CONTAINS",
              })

          document = {
              "spdxVersion": "SPDX-2.3",
              "dataLicense": "CC0-1.0",
              "SPDXID": "SPDXRef-DOCUMENT",
              "name": "safegguf-" + version,
              "documentNamespace": f"{server}/{repo}/releases/download/{tag}/safegguf-{version}.spdx.json",
              "creationInfo": {
                  "created": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "creators": ["Tool: safegguf-release-sbom", "Organization: SafeGGUF"],
                  "comment": f"Generated by GitHub Actions run {run_id} for {tag} ({commit})",
              },
              "packages": [{
                  "name": "safegguf",
                  "SPDXID": "SPDXRef-Package-safegguf",
                  "versionInfo": version,
                  "downloadLocation": f"{server}/{repo}",
                  "filesAnalyzed": True,
                  "licenseConcluded": "MIT",
                  "licenseDeclared": "MIT",
                  "copyrightText": "NOASSERTION",
                  "sourceInfo": f"Built from {server}/{repo}@{commit} with Zig {zig_version} (ReleaseSafe) by GitHub Actions run {run_id}",
                  "externalRefs": [{
                      "referenceCategory": "PACKAGE-MANAGER",
                      "referenceType": "purl",
                      "referenceLocator": f"pkg:github/{repo}@{commit}",
                  }],
              }],
              "files": files,
              "relationships": [{
                  "spdxElementId": "SPDXRef-DOCUMENT",
                  "relatedSpdxElement": "SPDXRef-Package-safegguf",
                  "relationshipType": "DESCRIBES",
              }] + relationships,
          }

          with open("dist/safegguf.spdx.json", "w", encoding="utf-8") as f:
              json.dump(document, f, indent=2, sort_keys=True)
              f.write("\n")
          print("Wrote dist/safegguf.spdx.json")
          PY

      - name: Attest Build Provenance for Release Binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/safegguf-*'

      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/safegguf-*'
          sbom-path: 'dist/safegguf.spdx.json'

      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: 'v2.6.5'

      - name: Keyless Sign SHA256 Manifest (Sigstore)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.txt.sigstore.json SHA256SUMS.txt

      - name: Verify Release Artifacts Before Publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Verifying SHA256 manifest..."
          sha256sum -c SHA256SUMS.txt
          echo "Verifying keyless signature on SHA256SUMS.txt..."
          cosign verify-blob \
            --bundle SHA256SUMS.txt.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yml@refs/tags/.*$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            SHA256SUMS.txt
          echo "Verifying artifact provenance attestations..."
          for artifact in safegguf-*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
          echo "All pre-publish verifications passed."

      - name: Upload Binaries, Checksums, SBOM & Signatures to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag_name="${GITHUB_REF#refs/tags/}"
          echo "Ensuring release $tag_name exists..."
          gh release view "$tag_name" >/dev/null 2>&1 || gh release create "$tag_name" --title "$tag_name" --generate-notes
          echo "Uploading assets to release $tag_name..."
          gh release upload "$tag_name" dist/* --clobber
