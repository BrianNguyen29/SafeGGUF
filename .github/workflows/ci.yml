name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify Code Formatting
        run: zig fmt --check src/ build.zig tests/*.zig

      - name: Generate Fixtures and Seed Corpus
        run: python tests/generate_fixtures.py

      - name: Run Exhaustive Unit, Fuzz, & Regression Tests
        run: zig build test --summary all

      - name: Build Binary (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Run End-to-End CLI Integration Tests (Exact Exit Codes & Invariants)
        run: python tests/cli_test.py

      - name: Build Upstream ggml 0.23.0 Oracle
        run: bash tests/build_oracle.sh

      - name: Run Independent Type Oracle Verification
        run: python tests/test_oracle_types.py

      - name: Run True Differential Test Suite (SafeGGUF vs Upstream ggml 0.23.0)
        run: python tests/differential.py

      - name: Verify Fuzz Crash Handler Persistence
        run: python tests/fuzz_mutation.py --test-crash-handler

      - name: Run High-Throughput Mutation Fuzzing (2,000 Iterations, 4,000 Executions)
        run: python tests/fuzz_mutation.py --iterations 2000

      - name: Upload Fuzz Crash Artifacts on Failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.os }}
          path: tests/fuzz-artifacts/
          if-no-files-found: ignore

  release:
    name: Build & Publish Release Artifacts
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0

      - name: Build Cross-Platform Release Binaries & SHA256 Manifest
        run: |
          mkdir -p dist
          targets=("x86_64-linux" "aarch64-linux" "x86_64-macos" "aarch64-macos" "x86_64-windows")
          for target in "${targets[@]}"; do
            echo "Building for $target..."
            ext=""
            if [[ "$target" == *"windows"* ]]; then
              ext=".exe"
            fi
            zig build -Doptimize=ReleaseSafe -Dtarget=$target
            cp zig-out/bin/safegguf${ext} dist/safegguf-${target}${ext}
          done
          cd dist
          sha256sum safegguf-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Binaries and Checksums to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag_name="${GITHUB_REF#refs/tags/}"
          echo "Uploading assets to release $tag_name..."
          gh release upload "$tag_name" dist/* --clobber
